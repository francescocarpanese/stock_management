name: Functional tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  functional_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]   # optional: test multiple versions
    steps:
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install uv
        run: pip install uv

      - name: Install project & dev dependencies with uv
        run: |
          uv pip install --system -e .
          uv pip install --system --group dev
      - name: Run tests
        run: uv run pytest
