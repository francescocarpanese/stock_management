name: Functional tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  functional_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]   # optional: test multiple versions
    steps:
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install uv
        run: pip install uv

      - name: Install project and dev dependencies & run tests
        run: |
          # install your project in editable mode (so code changes reflect)
          uv pip install -e .
          # install dev/test dependencies from your dev group
          uv pip install --group dev
          # run pytest inside the uv‐managed environment
          uv run pytest
